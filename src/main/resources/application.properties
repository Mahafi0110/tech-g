spring.application.name=techg
# Render tells the app which port to use through PORT. Locally it falls back to 8080.
server.port=${PORT:8080}

# ---------- MySQL (Aiven) ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Email ----------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------- Starting values (the client changes these later in the admin panel) ----------
app.admin-email=${ADMIN_EMAIL:}
app.phone=+00 00000 00000
app.email=hello@techg.example
app.address=Your street address, City

# ---------- Admin panel login ----------
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}

# ---------- Cloudinary ----------
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=techg/products

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB